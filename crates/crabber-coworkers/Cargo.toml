[package]
name = "crabber-coworkers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
borb-client = { git = "ssh://git@github.com/mattsp1290/borb.git", rev = "d574ed950d323f81cd9476a892029353c620581b" }
crabber = { git = "ssh://git@github.com/mattsp1290/crabber.git", rev = "a32b1a83bce10649b56498d7967ab3383490aa51", features = ["opencode-go", "sqlite"] }
crabber-tools-catalog = { git = "ssh://git@github.com/mattsp1290/crabber.git", rev = "a32b1a83bce10649b56498d7967ab3383490aa51" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net", "io-util"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
time = { version = "0.3", features = ["formatting"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
futures = "0.3"
tokio = { version = "1", features = ["net", "io-util", "test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
